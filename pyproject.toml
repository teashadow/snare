[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snare"
version = "0.1.0"
description = "MAD browser trap generator"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0",
  "rich>=13.0",
]

[project.scripts]
snare = "snare_app.cli:main"
